services:
  db:
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_USER: mainflix
      POSTGRES_PASSWORD: mainflix
      POSTGRES_DB: mainflix
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mainflix-db:/var/lib/postgresql/data
  db-test:
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_USER: mainflix
      POSTGRES_PASSWORD: mainflix
      POSTGRES_DB: mainflix_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainflix -d mainflix_test"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  mainflix-db:
